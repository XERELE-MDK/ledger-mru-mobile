name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Permissions stay minimal
        run: "! grep -rn 'uses-permission' android/app/src/main/AndroidManifest.xml"
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - name: APK for checking only (throwaway key, cannot update an installed app)
        uses: actions/upload-artifact@v4
        with:
          name: apk-de-verification
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 7
